# Single public entry point. TLS is terminated in front of this (load balancer or certbot); this file speaks http.
server {
    listen 80;
    server_name _;
    client_max_body_size 2m;

    # Re-resolve container names through Docker's DNS instead of once at startup. Otherwise recreating `api` or
    # `web` (every deploy) can leave nginx sending traffic to an address that no longer exists (502).
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $api http://api:8000;
    set $web http://web:3000;

    # Security headers are set once, by the app behind each location (Django for /api and /admin, Next.js for pages).

    location = /health/ {
        proxy_pass $api;
        proxy_set_header Host $http_host;   # without this Django sees "api:8000" and rejects it as a disallowed host
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /api/ {
        proxy_pass $api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
    }

    # The AI tutor streams server-sent events: buffering would hold the reply back until it finished.
    location ~ ^/api/v1/chat/sessions/[^/]+/messages/$ {
        proxy_pass $api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
    }

    location /admin/ {
        proxy_pass $api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /static/ {   # WhiteNoise serves hashed, cacheable files
        proxy_pass $api;
        proxy_set_header Host $http_host;
    }

    location /media/ {
        alias /srv/media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        proxy_pass $web;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
