# Production-shaped stack: nginx -> web (Next.js) + api (gunicorn) -> postgres, redis.
#   cp .env.example .env   # fill in secrets
#   docker compose up -d --build
#   docker compose exec api python manage.py import_prepiba
name: prepiba-prod

x-api-env: &api-env
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
  DATABASE_URL: postgres://prepiba:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/prepiba
  REDIS_URL: redis://redis:6379/1
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8088}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
  SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-true}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  AI_PROVIDER: ${AI_PROVIDER:-gemini}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
  SENTRY_DSN: ${SENTRY_DSN:-}

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: prepiba
      POSTGRES_USER: prepiba
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prepiba -d prepiba"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]   # cache only: throttles and quotas
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: { context: ., dockerfile: backend/Dockerfile }
    restart: unless-stopped
    environment: { <<: *api-env, RUN_MIGRATIONS: "1" }
    volumes: [media:/app/media]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Auto-submits exams whose time ran out and that nobody opened again (there is no Celery in this stack).
  sweeper:
    build: { context: ., dockerfile: backend/Dockerfile }
    restart: unless-stopped
    environment: *api-env
    command: ["sh", "-c", "while true; do python manage.py submit_expired_attempts; sleep 60; done"]
    depends_on:
      api: { condition: service_healthy }

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: /api/v1
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["${HTTP_PORT:-8088}:80"]
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - media:/srv/media:ro
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_started }

volumes:
  pgdata:
  media:
